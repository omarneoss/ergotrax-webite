name = "ergotrax-webite"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/", "/index.html"]

[[d1_databases]]
binding = "DB"
database_name = "ergotrax-accounts"
database_id = "2e530974-059b-436f-b96d-5116be84e911"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "ergotrax-media"
